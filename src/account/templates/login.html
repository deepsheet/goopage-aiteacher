<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ t('login_title') }} - {{ t('brand_name') }}</title>
    <link rel="stylesheet" href="{{ url_for('account.static', filename='css/account.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script src="{{ url_for('account.static', filename='js/account.js') }}"></script>
    <link rel="icon" href="/favicon.ico?v=2" type="image/x-icon">
</head>
<body class="login-body">
    <div class="container">
        <div class="form-container">
            <a href="/" class="login-logo-link">
                <img src="/favicon.ico" alt="{{ t('logo_alt') }}" class="login-logo">
                <span class="brand-name">{{ t('brand_name') }}</span>
            </a>
            <h2>{{ t('login') }}</h2>

            <div class="form-group">
                <label for="username">{{ t('username_or_email') }}</label>
                <input type="text" id="username" placeholder="{{ t('enter_username_or_email') }}">
            </div>

            <div class="form-group">
                <label for="password">{{ t('password') }}</label>
                <input type="password" id="password" placeholder="{{ t('enter_password') }}">
            </div>

            <!-- 登录成功后跳转地址 -->
            <input type="hidden" id="redirectUrl" value="{{ redirect_url }}">

            <div class="form-group checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="rememberAccount" checked>
                    <span>{{ t('remember_account') }}</span>
                </label>
            </div>

            <button class="submit-btn">{{ t('login') }}</button>

            <div class="form-footer">
                <span>{{ t('no_account') }}</span>
                <a href="{{ url_for('account.register_page') }}">{{ t('register') }}</a>
            </div>

            <div class="back-home">
                <a href="/">← {{ t('back_to_home') }}</a>
            </div>
        </div>
    </div>
</body>
</html>
